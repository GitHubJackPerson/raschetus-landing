# nginx vhost для raschetus.ru — прод-VPS 72.56.247.99 (тот же сервер, что app-stpulse.ru)
# Разворачивается в /etc/nginx/sites-available/raschetus.ru + симлинк в sites-enabled.
# Блоки "managed by Certbot" (443 ssl + редирект 80→443) добавляет certbot:
#   certbot --nginx -d raschetus.ru
# gzip включён глобально в /etc/nginx/nginx.conf — здесь не дублируем.
# Держим этот файл в репозитории, чтобы конфиг не потерялся при пересоздании сервера
# (урок STPulse: инфра, правленная только по SSH, теряется при ребилде).

server {
    server_name raschetus.ru;
    root /var/www/raschetus.ru;
    index index.html;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:woff2|woff|svg|png|jpg|jpeg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(?:css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/raschetus-access.log;
    error_log  /var/log/nginx/raschetus-error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/raschetus.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/raschetus.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = raschetus.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name raschetus.ru;
    return 404; # managed by Certbot
}

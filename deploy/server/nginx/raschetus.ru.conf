# nginx vhost для raschetus.ru — прод-VPS 72.56.247.99 (тот же сервер, что app-stpulse.ru)
# Разворачивается в /etc/nginx/sites-available/raschetus.ru + симлинк в sites-enabled.
# Сертификат Let's Encrypt покрывает raschetus.ru + www.raschetus.ru:
#   certbot certonly --nginx -d raschetus.ru -d www.raschetus.ru --expand
# gzip включён глобально в /etc/nginx/nginx.conf — здесь не дублируем.
# Держим этот файл в репозитории, чтобы конфиг не потерялся при пересоздании сервера
# (урок STPulse: инфра, правленная только по SSH, теряется при ребилде).

# ── apex: отдаёт контент ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name raschetus.ru;
    root /var/www/raschetus.ru;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/raschetus.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raschetus.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:woff2|woff|svg|png|jpg|jpeg|ico)$ { expires 30d; access_log off; try_files $uri =404; }
    location ~* \.(?:css|js)$ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/raschetus-access.log;
    error_log  /var/log/nginx/raschetus-error.log;
}

# ── www: 301 на канонический apex ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.raschetus.ru;
    ssl_certificate /etc/letsencrypt/live/raschetus.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raschetus.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://raschetus.ru$request_uri;
}

# ── HTTP → HTTPS (apex + www сразу на apex) ──
server {
    listen 80;
    listen [::]:80;
    server_name raschetus.ru www.raschetus.ru;
    return 301 https://raschetus.ru$request_uri;
}

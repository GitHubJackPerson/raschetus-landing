# расчётус.рф → 301 → raschetus.ru
# IDN punycode: расчётус.рф = xn--80a5aeaeg0a4f.xn--p1ai
#
# Порядок установки на сервере (72.56.247.99):
#   1) DNS: A @ и A www для расчётус.рф → 72.56.247.99 (в панели домена).
#   2) Положить этот файл в /etc/nginx/sites-available/raschetus-rf-redirect.conf,
#      симлинк в sites-enabled/, `nginx -t && systemctl reload nginx`
#      (сейчас активен только :80-блок — 301 уже работает по http).
#   3) После propagation DNS выпустить сертификат:
#        certbot --nginx -d xn--80a5aeaeg0a4f.xn--p1ai -d www.xn--80a5aeaeg0a4f.xn--p1ai
#      certbot сам добавит :443-блок с редиректом (https://расчётус.рф тоже уедет
#      на raschetus.ru без предупреждения о сертификате).

server {
    listen 80;
    listen [::]:80;
    server_name xn--80a5aeaeg0a4f.xn--p1ai www.xn--80a5aeaeg0a4f.xn--p1ai;

    # даём certbot пройти ACME-проверку (webroot общий с лендингом)
    location /.well-known/acme-challenge/ {
        root /var/www/raschetus.ru;
    }

    location / {
        return 301 https://raschetus.ru$request_uri;
    }
}
